name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:contract
      - run: npm test
      - run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
